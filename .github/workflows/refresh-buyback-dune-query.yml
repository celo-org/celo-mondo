name: Refresh Buyback Dune Query

# Re-executes the Dune P&L query (id 6898547) that powers the /buyback
# dashboard, so its data is at most a day old. The app itself only reads the
# query's cached results and never spends execution credits.
#
# Needs the DUNE_API_KEY repository secret: a key of a Dune account that may
# execute queries and has datapoint budget left for one execution a day.

on:
  schedule:
    # Run daily at 05:30 UTC (after the previous UTC day is complete and
    # Dune's ingestion has caught up)
    - cron: '30 5 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  execute-query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute Dune query 6898547 and wait for it to finish
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_API: https://api.dune.com/api/v1
        run: |
          set -euo pipefail

          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "The DUNE_API_KEY secret is not set" >&2
            exit 1
          fi

          # Every execution is billed, so do nothing if one already ran today
          # (a manual run, say). One row of the latest results says which day
          # that was; if this check itself fails, just go ahead and execute.
          today=$(date -u +%Y-%m-%d)
          if curl -sS --max-time 30 -f -o latest.json \
               "$DUNE_API/query/6898547/results?limit=1" \
               -H "X-Dune-API-Key: $DUNE_API_KEY" \
             && [ "$(jq -r '.state' latest.json)" = "QUERY_STATE_COMPLETED" ] \
             && [ "$(jq -r '.execution_started_at // "" | .[:10]' latest.json)" = "$today" ]; then
            echo "Dune already executed the query today ($(jq -r '.execution_started_at' latest.json)); nothing to do"
            exit 0
          fi

          # No automatic retry here: the request is not idempotent, and resending
          # it after a lost response would enqueue (and bill) a second execution
          # while only the last id is polled. A failed start fails the run. The
          # body is kept so Dune's reason is in the log when it refuses. The
          # default engine tier is used: Dune rejects "medium" and "large".
          http_code=$(curl -sS --max-time 30 -o execute.json -w '%{http_code}' \
            -X POST "$DUNE_API/query/6898547/execute" \
            -H "X-Dune-API-Key: $DUNE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$http_code" != "200" ]; then
            echo "Dune refused to start the execution (HTTP $http_code):" >&2
            cat execute.json >&2
            exit 1
          fi
          execution_id=$(jq -r '.execution_id // empty' execute.json)
          if [ -z "$execution_id" ]; then
            echo "Dune did not return an execution id:" >&2
            cat execute.json >&2
            exit 1
          fi
          echo "Dune execution $execution_id started"

          # /execute only enqueues the run. Poll until Dune reports a terminal
          # state (as report.py's wait_for_execution does) so a failed or stuck
          # refresh shows up as a failed workflow instead of silently stale data.
          for _ in $(seq 1 60); do
            # A transient API hiccup should not fail the refresh; try again next tick.
            if ! status=$(curl --fail-with-body -sS --max-time 30 \
              "$DUNE_API/execution/$execution_id/status" \
              -H "X-Dune-API-Key: $DUNE_API_KEY"); then
              echo "Status check failed, retrying..."
              sleep 10
              continue
            fi
            state=$(echo "$status" | jq -r '.state')
            if [ "$(echo "$status" | jq -r '.is_execution_finished')" = "true" ]; then
              if [ "$state" != "QUERY_STATE_COMPLETED" ]; then
                echo "Dune execution $execution_id ended with state $state:" >&2
                echo "$status" >&2
                exit 1
              fi
              echo "Dune execution $execution_id completed"
              exit 0
            fi
            echo "State: $state, waiting..."
            sleep 10
          done

          echo "Timed out waiting for Dune execution $execution_id" >&2
          exit 1
