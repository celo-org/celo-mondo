name: Refresh Buyback Dune Query

# Re-executes the Dune P&L query (id 6898547) that powers the /buyback
# dashboard, so its data is at most a day old. The app itself only reads the
# query's cached results and never spends execution credits.
#
# Needs the DUNE_API_KEY repository secret: a key of a Dune account that may
# execute queries and has datapoint budget left for one execution a day.

on:
  schedule:
    # Run daily at 05:30 UTC (after the previous UTC day is complete and
    # Dune's ingestion has caught up)
    - cron: '30 5 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Execute even if Dune ran the query recently or already today'
        type: boolean
        default: false

# One run at a time: two overlapping runs would both pass the "already
# executed today" check before either execution finished, then both would
# start a billed execution. The second waits and sees the first one's result.
concurrency:
  group: refresh-buyback-dune-query
  cancel-in-progress: false

jobs:
  execute-query:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute Dune query 6898547 and wait for it to finish
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_API: https://api.dune.com/api/v1
          FORCE: ${{ inputs.force }}
          # Must match the cron schedule above.
          REFRESH_TIME_UTC: '05:30:00'
          # A run started this soon after another is a duplicate, not a refresh.
          RECENT_SECONDS: '1800'
        run: |
          set -euo pipefail

          if [ -z "${DUNE_API_KEY:-}" ]; then
            echo "The DUNE_API_KEY secret is not set" >&2
            exit 1
          fi

          # Every execution is billed, so a run does nothing if Dune already ran
          # the query today at or after the scheduled time, when the previous
          # UTC day is complete and ingested, or started one less than half an
          # hour ago (two runs queued together, say). One row of the latest
          # results says when the last execution started; if this check itself
          # fails, or the value is not a real UTC timestamp, just go ahead and
          # execute. The force input runs regardless: it is how a bad
          # execution (after a query edit, say) gets replaced once the query is
          # fixed.
          today=$(date -u +%Y-%m-%d)
          if [ "$FORCE" != "true" ] && curl -sS --max-time 30 -f -o latest.json \
               "$DUNE_API/query/6898547/results?limit=1" \
               -H "X-Dune-API-Key: $DUNE_API_KEY" \
             && [ "$(jq -r '.state' latest.json)" = "QUERY_STATE_COMPLETED" ] \
             && started=$(jq -r '.execution_started_at // ""' latest.json) \
             && [[ "$started" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})T(([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9])(\.[0-9]+)?Z$ ]]; then
            started_day=${BASH_REMATCH[1]}
            started_time=${BASH_REMATCH[2]}
            if [ "$started_day" = "$today" ] \
               && [[ "$started_time" > "$REFRESH_TIME_UTC" || "$started_time" == "$REFRESH_TIME_UTC" ]]; then
              echo "Dune already executed the query today at $started, after the scheduled time; nothing to do"
              exit 0
            fi
            started_epoch=$(jq -rn --arg t "${started_day}T${started_time}Z" '$t | fromdateiso8601')
            if (( $(date -u +%s) - started_epoch < RECENT_SECONDS )); then
              echo "Dune started an execution at $started, less than ${RECENT_SECONDS}s ago; nothing to do (set force to run anyway)"
              exit 0
            fi
          fi

          # No automatic retry here: the request is not idempotent, and resending
          # it after a lost response would enqueue (and bill) a second execution
          # while only the last id is polled. A failed start fails the run. The
          # body is kept so Dune's reason is in the log when it refuses. The
          # default engine tier is used: Dune rejects "medium" and "large".
          http_code=$(curl -sS --max-time 30 -o execute.json -w '%{http_code}' \
            -X POST "$DUNE_API/query/6898547/execute" \
            -H "X-Dune-API-Key: $DUNE_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$http_code" != "200" ]; then
            echo "Dune refused to start the execution (HTTP $http_code):" >&2
            cat execute.json >&2
            exit 1
          fi
          if ! execution_id=$(jq -r '.execution_id // empty' execute.json) || [ -z "$execution_id" ]; then
            echo "Dune did not return an execution id:" >&2
            cat execute.json >&2
            exit 1
          fi
          echo "Dune execution $execution_id started"

          # /execute only enqueues the run. Poll until Dune reports a terminal
          # state (as report.py's wait_for_execution does) so a failed or stuck
          # refresh shows up as a failed workflow instead of silently stale data.
          for _ in $(seq 1 60); do
            # A transient API hiccup should not fail the refresh; try again next tick.
            if ! status=$(curl --fail-with-body -sS --max-time 30 \
              "$DUNE_API/execution/$execution_id/status" \
              -H "X-Dune-API-Key: $DUNE_API_KEY"); then
              echo "Status check failed, retrying..."
              sleep 10
              continue
            fi
            # A truncated or garbled body is as transient as a failed request.
            if ! state=$(jq -r '.state // empty' <<< "$status") \
               || ! finished=$(jq -r '.is_execution_finished // empty' <<< "$status") \
               || [ -z "$state" ]; then
              echo "Unreadable status response, retrying..."
              sleep 10
              continue
            fi
            if [ "$finished" = "true" ]; then
              if [ "$state" != "QUERY_STATE_COMPLETED" ]; then
                echo "Dune execution $execution_id ended with state $state:" >&2
                echo "$status" >&2
                exit 1
              fi
              echo "Dune execution $execution_id completed"
              exit 0
            fi
            echo "State: $state, waiting..."
            sleep 10
          done

          echo "Timed out waiting for Dune execution $execution_id" >&2
          exit 1
